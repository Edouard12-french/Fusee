<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fusée</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#12151d">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#181c26;--line:#262b38;--text:#e7e9ee;--muted:#8b93a7;--accent:#7c5cff;--me:#1f3d2b;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:18px;margin:0 6px 0 0;display:flex;align-items:center;gap:8px}
header h1 img{width:26px;height:26px;border-radius:7px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px;white-space:nowrap}
.bar{width:90px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--accent)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent)}
button.on{background:#14532d;border-color:var(--ok)}
a{color:#9db4ff}
main{flex:1;display:grid;grid-template-columns:250px 1fr 460px;min-height:0}
aside,section{min-height:0;overflow:auto}
#agents{border-right:1px solid var(--line);padding:10px}
.agent{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
.agent:hover,.agent.sel{background:var(--panel2);border-color:var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.agent b{display:block}.agent small{color:var(--muted);display:block;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#555}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.err{background:var(--bad)}
#chat{display:flex;flex-direction:column;background:#0e1118}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;background:var(--panel2);border-radius:12px;padding:8px 12px;border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.msg .who{font-weight:600;font-size:12px;margin-bottom:2px}
.msg .t{color:var(--muted);font-size:11px;text-align:right}
.msg.me{align-self:flex-end;background:var(--me)}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;white-space:normal}
.att img{max-width:220px;max-height:220px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.att video{max-width:260px;max-height:300px;border-radius:8px;background:#000}
.lnk{display:inline-block;background:#1e2540;border:1px solid #33407a;border-radius:8px;padding:3px 9px;font-size:12px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
form.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
textarea,input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{flex:1;resize:none}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:5px 9px;font-size:13px}.tabs button.sel{background:var(--accent);border-color:var(--accent)}
#pane{padding:12px;overflow:auto;flex:1}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.card h4{margin:0 0 4px}.muted{color:var(--muted);font-size:12px}
.card.pending{border-color:var(--warn)}.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.act{border-left:3px solid var(--line);padding:4px 8px;margin-bottom:6px;font-size:13px}
.act.web{border-color:#0ea5e9}.act.outil{border-color:var(--warn)}.act.fichier,.act.capture,.act.vidéo{border-color:var(--ok)}.act.erreur{border-color:var(--bad)}.act.réflexion{border-color:var(--accent)}
details summary{cursor:pointer}
pre{white-space:pre-wrap;word-wrap:break-word;background:#0b0d12;padding:8px;border-radius:8px;font-size:12px;max-height:400px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;border-bottom:1px solid var(--line);text-align:left}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#262b38;display:inline-block;margin:1px 0}
.badge{background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.md h1,.md h2,.md h3{margin:.6em 0 .3em}
.score{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}
.score i{display:block;height:100%}
.thread{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.bub{max-width:85%;padding:7px 10px;border-radius:10px;white-space:pre-wrap;word-wrap:break-word;font-size:13px}
.bub.in{align-self:flex-start;background:#232838}.bub.out{align-self:flex-end;background:#2b2160}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.preview{width:100%;height:220px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;background:#fff;margin:6px 0}
.preview iframe{width:250%;height:250%;transform:scale(.4);transform-origin:0 0;border:0;pointer-events:none}
.big{font-size:26px;font-weight:700}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
#lightbox.open{display:grid}#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
nav#bottom{display:none}
@media (max-width:1000px){
  main{display:block;position:relative}
  #agents,#chat,#side{position:absolute;inset:0;display:none}
  body.v-team #agents{display:block}body.v-chat #chat{display:flex}body.v-more #side{display:flex}
  #agents{border:0}#side{border:0}
  nav#bottom{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
  nav#bottom button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;font-size:12px;color:var(--muted)}
  nav#bottom button.sel{color:var(--text);background:var(--panel2)}
  .msg{max-width:92%}.pill.hide-m{display:none}.lbl{display:none}header .bar{display:none}header{flex-wrap:nowrap;gap:6px;padding:8px 10px}header h1{font-size:16px}header button{padding:6px 9px}
  .att img{max-width:150px}.att video{max-width:170px;max-height:240px}
}
</style>
</head>
<body class="v-chat">
<header>
  <h1><img src="/icon-192.png" alt="">Fusée</h1>
  <span class="pill hide-m" id="model"></span>
  <span class="pill" title="Argent restant · dépense IA du jour">💶 <span id="cost"></span><span class="bar"><i id="costbar"></i></span></span>
  <span style="flex:1"></span>
  <button id="installBtn" hidden>📲<span class="lbl"> Installer l'app</span></button>
  <button id="browserBtn" title="Autoriser les agents à naviguer sur internet avec un vrai navigateur"></button>
  <button id="directiveBtn" title="Consigne permanente lue par tous les agents">🎯<span class="lbl"> Consigne</span></button>
  <button id="pauseBtn"></button>
</header>
<main>
  <aside id="agents"></aside>
  <section id="chat">
    <div id="msgs"></div>
    <form class="send" id="f"><textarea id="txt" rows="2" placeholder="Écris au groupe… (@Neo, @Iris… pour cibler un agent, @Tous pour tout le monde)"></textarea><button class="primary">Envoyer</button></form>
  </section>
  <aside id="side">
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </aside>
</main>
<nav id="bottom">
  <button data-v="team">🤖<br>Équipe</button>
  <button data-v="chat">💬<br>Groupe</button>
  <button data-v="more" id="moreBtn">📋<br>Suivi</button>
</nav>
<div id="lightbox"><img alt=""></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const time = ts => new Date(ts * 1000).toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
const mdTable = block => {
  const rows = block.trim().split("\n").filter(r => !/^\|[\s:|-]+\|$/.test(r.trim()));
  return "<table>" + rows.map((r, i) => "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|")
    .map(c => i === 0 ? `<th>${c.trim()}</th>` : `<td>${c.trim()}</td>`).join("") + "</tr>").join("") + "</table>";
};
const md = s => esc(s).replace(/(?:^\|.*\|[ \t]*(?:\n|$))+/gm, mdTable)
  .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  .replace(/^---$/gm,"<hr>").replace(/(<\/h[123]>|<\/table>|<hr>)\n+/g,"$1").replace(/\n/g,"<br>");
const api = (u, opt) => fetch(u, opt).then(r => r.json());
const post = (u, body) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
const wpath = p => "/w/" + p.split("/").map(encodeURIComponent).join("/");
let openProduct = null, S = {agents:[]}, lastId = 0, selected = null, tab = "agent", lastSig = "", openContact = null;
const TABS = {setup:"🚀 Démarrage", agent:"🤖 Agent", owner:"🙋 Pour toi", approvals:"✅ Validations", products:"📦 Produits", content:"📅 Contenus", contacts:"👥 Prospects", money:"💰 Argent",
  vitrine:"🖼️ Vitrine", flows:"⛓️ Workflows", box:"🧰 Boîte", ideas:"💡 Idées", reports:"📄 Rapports", pf:"📈 Bourse",
  notifs:"🔔 Notifs", settings:"⚙️ Réglages", feed:"⚡ Tout"};
const colorOf = n => (S.agents.find(a => a.name === n) || {}).color || "#22c55e";
const emojiOf = n => (S.agents.find(a => a.name === n) || {}).emoji || "👤";
const SENT = {"très positif":"😍", "positif":"🙂", "neutre":"😐", "hésitant":"🤔", "négatif":"😠", "inconnu":"❔"};

function attHtml(att) {
  if (!att) return "";
  const f = (att.files || []).map(p => /\.(mp4|webm)$/i.test(p)
    ? `<video src="${wpath(p)}#t=1" controls playsinline preload="metadata"></video>`
    : /\.(png|jpe?g|gif|webp)$/i.test(p) ? `<img src="${wpath(p)}" loading="lazy" alt="">`
    : `<a class="lnk" href="${wpath(p)}" target="_blank">📎 ${esc(p)}</a>`).join("");
  const l = (att.links || []).map(u => `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">🔗 ${esc(u.replace(/^https?:\/\//, ""))}</a>`).join("");
  return f || l ? `<div class="att">${f}${l}</div>` : "";
}

function renderAgents() {
  $("#agents").innerHTML = S.agents.map(a => {
    const st = a.status || "en attente", cls = st === "travaille" ? "on" : st.startsWith("erreur") || st.startsWith("budget") ? "err" : "";
    return `<div class="agent ${selected===a.name?"sel":""}" data-n="${a.name}">
      <div class="av" style="background:${a.color}33">${a.emoji}</div>
      <div style="min-width:0"><b>${a.name}</b><small>${esc(a.kind)} · ${esc(a.title)}</small>
      <small><span class="tag">${a.model.replace("claude-","").replace(/-(\d)-(\d)$/," $1.$2")}</span> <span class="tag">${a.interval_min ? "toutes les " + a.interval_min + " min" : "à la demande"}</span></small>
      <small><span class="dot ${cls}"></span>${esc(st)}</small>
      <small title="${esc(a.task)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.task || "—")}</small>
      <small>${a.cycles||0} cycles · ${(a.cost_usd||0).toFixed(2)} $</small></div></div>`;
  }).join("");
  document.querySelectorAll(".agent").forEach(el => el.onclick = () => { selected = el.dataset.n; tab = "agent"; renderAgents(); renderTabs(); renderPane(); setView("more"); });
}

function addMessages(list) {
  const box = $("#msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  for (const m of list) {
    lastId = Math.max(lastId, m.id);
    const me = m.sender === "Patron";
    box.insertAdjacentHTML("beforeend", `<div class="msg ${me?"me":""}"><div class="who" style="color:${colorOf(m.sender)}">${emojiOf(m.sender)} ${esc(m.sender)}</div>${esc(m.content).replace(/(^|\s)@(\w+)/g,"$1<b>@$2</b>")}${attHtml(m.attachments)}<div class="t">${time(m.ts)}</div></div>`);
  }
  if (list.length && stick) box.scrollTop = box.scrollHeight;
}

async function poll() {
  try {
    const r = await api("/api/state?after=" + lastId);
    S = r;
    if (!selected) selected = r.agents[0]?.name;
    $("#model").textContent = "plan " + r.plan;
    $("#cost").textContent = `${r.budget.remaining_eur.toFixed(2)} € · IA ${r.budget.api_today_eur.toFixed(2)}/${r.budget.api_daily_cap_eur.toFixed(2)} €`;
    $("#costbar").style.width = Math.min(100, 100 * r.budget.api_today_eur / Math.max(r.budget.api_daily_cap_eur, 0.01)) + "%";
    $("#pauseBtn").innerHTML = r.paused ? "▶️<span class=lbl> Reprendre</span>" : "⏸️<span class=lbl> Pause</span>";
    $("#browserBtn").innerHTML = r.browser_enabled ? "🌐<span class=lbl> Navigateur : autorisé</span>" : "🌐<span class=lbl> Navigateur : bloqué</span>";
    $("#browserBtn").classList.toggle("on", r.browser_enabled);
    renderAgents(); addMessages(r.messages);
    const sig = [r.pending_approvals, r.unread_notifications, r.waiting_contacts, r.open_questions, r.open_owner_tasks].join("/");
    if (sig !== lastSig) { lastSig = sig; renderTabs(); if (["approvals","contacts","owner"].includes(tab)) renderPane(true); }
    if (["agent", "feed", "flows"].includes(tab) || (tab === "contacts" && openContact)) renderPane(true);
    const n = r.pending_approvals + r.waiting_contacts + r.open_questions; $("#moreBtn").innerHTML = "📋<br>Suivi" + (n ? ` <span class="badge">${n}</span>` : "");
  } catch (e) { console.error(e); }
}

function renderTabs() {
  const b = {approvals: S.pending_approvals, notifs: S.unread_notifications, contacts: S.waiting_contacts,
    owner: (S.open_questions || 0) + (S.open_owner_tasks || 0)};
  $("#tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button class="${tab===k?"sel":""}" data-t="${k}">${v}${b[k] ? ` <span class="badge">${b[k]}</span>` : ""}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(x => x.onclick = () => { tab = x.dataset.t; openContact = null; renderTabs(); renderPane(); });
}

const actHtml = a => `<div class="act ${a.kind}"><span class="muted">${time(a.ts)} · ${a.agent} · ${a.kind}</span><br>
  ${/^(capture|vidéo)$/.test(a.kind) && a.detail ? esc(a.summary) + attHtml({files:[a.detail]})
    : a.detail ? `<details><summary>${esc(a.summary)}</summary><pre>${esc(a.detail)}</pre></details>` : esc(a.summary)}</div>`;

function scoreBar(s) { const c = s >= 70 ? "var(--ok)" : s >= 40 ? "var(--warn)" : "#64748b"; return `<div class="score"><i style="width:${s}%;background:${c}"></i></div>`; }

let busy = false;
async function renderPane(soft) {
  if (busy) return; busy = true;
  const pane = $("#pane"), keep = soft ? pane.scrollTop : 0;
  try {
    if (tab === "agent") {
      const a = S.agents.find(x => x.name === selected); if (!a) return;
      const [acts, mem] = await Promise.all([api("/api/activity?agent=" + a.name), api("/api/memory/" + a.name)]);
      const open = soft && pane.querySelector("#memd")?.open;
      pane.innerHTML = `<div class="card"><h4>${a.emoji} ${a.name} — ${esc(a.title)}</h4>
        <div class="muted">Statut : ${esc(a.status)} · cycle toutes les ${a.interval_min} min · dernier : ${a.last_run ? time(a.last_run) : "jamais"}</div>
        <p><b>En ce moment :</b> ${esc(a.task || "—")}</p>
        <button onclick="post('/api/wake/${a.name}')">⚡ Lancer un cycle maintenant</button></div>
        <details class="card" id="memd" ${open?"open":""}><summary><b>🧠 Mémoire / plan</b></summary><div class="md">${md(mem.content || "(vide)")}</div></details>
        <h4>Ce qu'il a fait</h4>${acts.map(actHtml).join("") || "<p class=muted>Rien encore.</p>"}`;
    } else if (tab === "feed") {
      pane.innerHTML = (await api("/api/activity?limit=200")).map(actHtml).join("") || "<p class=muted>Rien encore.</p>";
    } else if (tab === "approvals") {
      const list = await api("/api/approvals");
      if (soft && pane.querySelector("input:focus")) return;
      pane.innerHTML = `<p class="muted">Rien n'est lancé sans ton accord. Accepte ou refuse (commentaire facultatif) : l'agent est réveillé avec ta réponse.</p>` +
        (list.map(a => `<div class="card ${a.status==="en attente"?"pending":""}"><h4>#${a.id} ${esc(a.title)}</h4>
          <span class="tag">${esc(a.kind)}</span> <span class="tag">${esc(a.status)}</span> ${a.amount_eur ? `<span class="tag">💶 ${a.amount_eur} €</span>` : ""} <span class="muted">par ${a.agent} · ${time(a.ts)}</span>
          <div class="md" style="margin:8px 0">${md(a.details)}</div>${attHtml(a.attachments)}
          ${a.status === "en attente" ? `<input id="c${a.id}" placeholder="Commentaire (optionnel)" style="width:100%;margin:6px 0">
            <button class="primary" onclick="decide(${a.id},true)">✅ Accepter</button> <button onclick="decide(${a.id},false)">❌ Refuser</button>`
            : (a.response ? `<div class="muted">Ton commentaire : ${esc(a.response)}</div>` : "")}</div>`).join("") || "<p class=muted>Aucune demande.</p>");
    } else if (tab === "contacts") {
      if (openContact) {
        const d = await api("/api/contacts/" + openContact), c = d.contact;
        if (soft && pane.querySelector("textarea:focus")) return;
        pane.innerHTML = `<button onclick="openContact=null;renderPane()">← Tous les prospects</button>
          <div class="card" style="margin-top:8px"><h4>${SENT[c.sentiment]||"❔"} ${esc(c.name || c.email || "Visiteur #" + c.id)} ${c.company ? "· " + esc(c.company) : ""}</h4>
          <span class="tag">${esc(c.segment)}</span> <span class="tag">${esc(c.status)}</span> <span class="tag">ressenti : ${esc(c.sentiment)}</span> <span class="tag">score ${c.score}/100</span>
          ${scoreBar(c.score)}<div><b>Intéressé par :</b> ${esc(c.interest || "—")}</div><div><b>Potentiel futur :</b> ${esc(c.potential || "—")}</div>
          <div class="muted">${esc(c.email || "pas d'e-mail")} · source : ${esc(c.source)} · premier contact ${time(c.created_ts)}</div></div>
          <div class="thread">${d.messages.map(m => `<div class="bub ${m.direction}"><span class="muted">${m.channel === "email" ? "✉️" : "💬"} ${m.direction === "in" ? "Client" : esc(m.agent || "Nous")} · ${time(m.ts)}</span><br>${esc(m.content)}</div>`).join("")}</div>
          <form class="send" id="rf" style="padding:0;border:0;background:none"><textarea id="rt" rows="2" placeholder="Répondre toi-même à ce client…"></textarea><button class="primary">Envoyer</button></form>`;
        $("#rf").onsubmit = async e => { e.preventDefault(); const t = $("#rt").value.trim(); if (!t) return;
          const r = await post(`/api/contacts/${c.id}/reply`, {content: t}); if (!r.ok) alert("Erreur : " + (await r.text())); renderPane(); };
      } else {
        const list = await api("/api/contacts");
        pane.innerHTML = `<p class="muted">Tous les gens qui ont parlé à l'équipe (chat des sites, e-mails), classés par intérêt. Iris évalue leur ressenti et leur potentiel.</p>` +
          (list.map(c => `<div class="card click" onclick="openContact=${c.id};renderPane()">
            <h4>${SENT[c.sentiment]||"❔"} ${esc(c.name || c.email || "Visiteur #" + c.id)} ${c.waiting ? '<span class="badge">attend une réponse</span>' : ""}</h4>

        <h4>Ordres</h4>${p.trades.map(t => `<div class="act"><span class="muted">${time(t.ts)}</span> <b class="${t.side==="buy"?"pos":"neg"}">${t.side==="buy"?"ACHAT":"VENTE"}</b> ${+t.qty} ${esc(t.symbol)} @ ${t.price}<br><span class="muted">${esc(t.rationale)}</span></div>`).join("") || "<p class=muted>Aucun ordre.</p>"}`;
    } else if (tab === "notifs") {
      const list = await api("/api/notifications");
      pane.innerHTML = list.map(n => `<div class="act ${n.kind==="alerte"?"erreur":n.kind==="client"?"fichier":"web"}"><span class="muted">${time(n.ts)} · ${n.kind}</span><br><b>${esc(n.title)}</b><details><summary class="muted">détails</summary><pre>${esc(n.body)}</pre></details></div>`).join("") || "<p class=muted>Aucune notification.</p>";
      S.unread_notifications = 0; lastSig = ""; renderTabs();
    } else if (tab === "settings") {
      if (soft) return;
      const c = S.capabilities, ok = b => b ? "✅" : "⚪";
      pane.innerHTML = `<div class="card"><h4>Ce qui est branché</h4>
          ${ok(c.push)} Notifications téléphone (ntfy)<br>${ok(c.netlify)} Mise en ligne des sites (Netlify)<br>${ok(c.stripe)} Paiements (Stripe)<br>
          ${ok(c.email)} E-mail clients<br>${ok(c.public_url)} Chat sur les sites ${c.public_url ? "(" + esc(c.public_url) + ")" : "(PUBLIC_URL)"}<br>
          ${ok(S.browser_enabled)} Navigateur web des agents
          <p class="muted">Tout se règle dans le fichier .env (voir le README), puis redémarre Fusée.</p>
          <button onclick="post('/api/test_notification')">📱 Envoyer une notification de test</button></div>
        <div class="card"><h4>Réponses aux clients (Iris)</h4>
          <select id="smode"><option value="auto">Réponse automatique + notification</option><option value="validation">Je valide chaque réponse avant envoi</option></select></div>
        <div class="card"><h4>📲 Installer l'application</h4><p class="muted">Sur téléphone : ouvre cette page dans Chrome (Android) → menu ⋮ → « Installer l'application », ou Safari (iPhone) → Partager → « Sur l'écran d'accueil ». Sur ordinateur : icône d'installation dans la barre d'adresse de Chrome/Edge.</p></div>`;
      $("#smode").value = S.support_mode;
      $("#smode").onchange = e => post("/api/support_mode?mode=" + e.target.value).then(poll);
    }
    if (soft) pane.scrollTop = keep;
  } finally { busy = false; }
}

const randTopic = () => "fusee-" + Array.from(crypto.getRandomValues(new Uint8Array(8)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const SETUP_STEPS = [
  {title: "Clé API Anthropic (le cerveau des agents)", need: "obligatoire", test: "anthropic",
   help: `**Avec un parent** (il faut avoir 18 ans) : va sur https://platform.claude.com → crée le compte → **Billing** : ajoute un moyen de paiement et un petit crédit (ex. 20 €) → **Limits** : fixe une **limite de dépense mensuelle** (sécurité) → **API Keys** → *Create Key* → copie la clé ici.`,
   fields: [{k: "ANTHROPIC_API_KEY", label: "Clé API (commence par sk-ant-)", type: "password"}]},
  {title: "Notifications sur ton téléphone", need: "conseillé", test: "ntfy",
   help: `Installe l'app gratuite **ntfy** (App Store / Google Play) → bouton **+** → « S'abonner à un sujet » → tape exactement le nom ci-dessous (garde-le secret : n'importe qui le connaissant pourrait lire tes notifications).`,
   fields: [{k: "NTFY_TOPIC", label: "Nom secret du sujet", ph: "ex. " + randTopic()}]},
  {title: "Mot de passe de l'appli", need: "conseillé",
   help: `Protège l'appli quand tu l'ouvres depuis ton téléphone (n'importe quel nom d'utilisateur + ce mot de passe). Indispensable avant de rendre Fusée accessible hors de chez toi.`,
   fields: [{k: "DASHBOARD_PASSWORD", label: "Mot de passe", type: "password"}]},
  {title: "Ton profil et le plan IA", need: "conseillé",
   help: `Le plan règle le coût : **Éco** pour démarrer avec un petit budget, **Équilibré** ou **Max** quand ça rapporte.`,
   fields: [{k: "OWNER_MINOR", label: "As-tu moins de 18 ans ?", type: "select", def: "true", options: [["true", "Oui (un parent ouvre les comptes)"], ["false", "Non, j'ai 18 ans ou plus"]]},
            {k: "FUSEE_PLAN", label: "Plan IA", type: "select", def: "eco", options: [["eco", "Éco — le moins cher"], ["equilibre", "Équilibré"], ["max", "Max — le plus intelligent, le plus cher"]]}]},
  {title: "Netlify — mettre les sites en ligne", need: "quand un site est prêt", test: "netlify",
   help: `Gratuit. https://app.netlify.com/signup (avec un parent) → avatar → **User settings** → **Applications** → **Personal access tokens** → *New access token* → copie-le ici.`,
   fields: [{k: "NETLIFY_TOKEN", label: "Jeton Netlify", type: "password"}]},
  {title: "Stripe — encaisser les ventes", need: "quand un produit est prêt", test: "stripe",
   help: `**Compte au nom d'un parent** (l'argent arrive sur son compte bancaire). https://dashboard.stripe.com/register → **Développeurs** → **Clés API** → *Clé secrète*. Commence par une clé **sk_test_** pour tout essayer sans vrai paiement.`,
   fields: [{k: "STRIPE_SECRET_KEY", label: "Clé secrète Stripe", type: "password"}]},
  {title: "Adresse publique — chat sur les sites en ligne", need: "plus tard", test: "public_url",
   help: `Sur ton Mac : installe l'app **Tailscale** (https://tailscale.com/download), connecte-toi, puis dans le Terminal : \`tailscale funnel --bg 8000\`. Il affiche une adresse en **https://…ts.net** : colle-la ici. Seul le chat des sites est accessible sans mot de passe.`,
   fields: [{k: "PUBLIC_URL", label: "Adresse publique", ph: "https://ton-mac.tailxxxx.ts.net"}]},
  {title: "E-mail des clients", need: "optionnel", test: "email",
   help: `Une adresse dédiée au business (ex. Gmail avec un **mot de passe d'application** : compte Google → Sécurité → Validation en 2 étapes → Mots de passe des applications).`,
   fields: [{k: "EMAIL_USER", label: "Adresse e-mail"}, {k: "EMAIL_PASSWORD", label: "Mot de passe d'application", type: "password"},
            {k: "IMAP_HOST", label: "Serveur IMAP", ph: "imap.gmail.com"}, {k: "SMTP_HOST", label: "Serveur SMTP", ph: "smtp.gmail.com"}]},
];
function setupValues(i) {
  const o = {}; document.querySelectorAll("#pane details")[i].querySelectorAll("[data-k]").forEach(el => { if (el.value.trim()) o[el.dataset.k] = el.value.trim(); });
  if (o.NTFY_TOPIC === undefined) { const el = document.querySelector('[data-k="NTFY_TOPIC"]'); if (el && !el.value && i === 1) { o.NTFY_TOPIC = el.placeholder.replace("ex. ", ""); el.value = o.NTFY_TOPIC; } }
  return o;
}
async function setupSave(i) {
  const r = await post("/api/setup/save", setupValues(i));
  $("#sres" + i).textContent = r.ok ? "Enregistré ✅ (redémarre Fusée pour appliquer)" : "Erreur : " + (await r.text());
  if (r.ok) { const sm = document.querySelectorAll("#pane details")[i].querySelector("summary b"); sm.textContent = sm.textContent.replace("⚪", "✅"); }
}
async function setupTest(i) {
  $("#sres" + i).textContent = "Test en cours…";
  const r = await post("/api/setup/test", {service: SETUP_STEPS[i].test, values: setupValues(i)});
  const d = r.ok ? await r.json() : {ok: false, message: await r.text()};
  $("#sres" + i).textContent = d.message; $("#sres" + i).style.color = d.ok ? "var(--ok)" : "var(--bad)";
}
async function setupRestart() {
  const r = await post("/api/setup/restart"); if (!r.ok) { alert(await r.text()); return; }
  $("#srestart").textContent = "Redémarrage… la page se recharge toute seule.";
  setTimeout(function wait() { fetch("/manifest.webmanifest").then(x => x.ok ? location.reload() : setTimeout(wait, 1500)).catch(() => setTimeout(wait, 1500)); }, 3000);
}
function copyText(id, btn) {
  const el = document.getElementById(id); el.select();
  const done = () => { btn.textContent = "✅ Copié"; setTimeout(() => btn.textContent = "📋 Copier le texte", 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(el.value).then(done);
  else { document.execCommand("copy"); done(); }
}
async function contentStatus(id, status) { await post(`/api/content/${id}?status=${encodeURIComponent(status)}`); renderPane(); }
async function answerQ(id, value) {
  const answer = value ?? ($("#qa" + id) || {}).value ?? "";
  if (!answer.trim()) return;
  await post("/api/questions/" + id, {answer}); await poll(); renderPane();
}
async function doneTask(id, done) { await post(`/api/owner_tasks/${id}?done=${done}`); await poll(); renderPane(); }
async function saveBudget() {
  const r = await post("/api/budget/settings", {initial_eur: +$("#bi").value, api_budget_eur: +$("#ba").value, api_days: +$("#bd").value});
  if (!r.ok) alert("Erreur : " + (await r.text())); renderPane();
}
async function saveProfile() {
  const p = {}; document.querySelectorAll("[id^=pf_]").forEach(el => { if (el.value.trim()) p[el.id.slice(3)] = el.value.trim(); });
  await post("/api/profile", p); alert("Profil enregistré : Wolf prépare ta stratégie."); renderPane();
}
async function addLedger() {
  const r = await post("/api/ledger", {kind: $("#lk").value, amount_eur: +$("#la").value, label: $("#ll").value});
  if (!r.ok) alert("Montant et libellé obligatoires"); renderPane();
}
async function delLedger(id) { await fetch("/api/ledger/" + id, {method: "DELETE"}); renderPane(); }
async function decide(id, approve) {
  const comment = ($("#c" + id) || {}).value || "";
  const r = await post("/api/approvals/" + id, {approve, comment});
  if (!r.ok) alert("Erreur : " + (await r.text()));
  await poll(); renderPane();
}
function setView(v) {
  document.body.className = "v-" + v;
  document.querySelectorAll("nav#bottom button").forEach(b => b.classList.toggle("sel", b.dataset.v === v));
  if (v === "chat") $("#msgs").scrollTop = 1e9;
}
document.querySelectorAll("nav#bottom button").forEach(b => b.onclick = () => setView(b.dataset.v));
document.addEventListener("click", e => {
  if (e.target.tagName === "IMG" && e.target.closest(".att,.grid")) { $("#lightbox img").src = e.target.src; $("#lightbox").classList.add("open"); }
});
$("#lightbox").onclick = () => $("#lightbox").classList.remove("open");
$("#f").onsubmit = async e => {
  e.preventDefault(); const t = $("#txt").value.trim(); if (!t) return;
  $("#txt").value = ""; await post("/api/message", {content: t}); poll();
};
$("#txt").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#f").requestSubmit(); } };
$("#pauseBtn").onclick = async () => { await post("/api/pause?on=" + !S.paused); poll(); };
$("#browserBtn").onclick = async () => {
  if (!S.browser_enabled && !confirm("Autoriser les agents à ouvrir des pages web dans un vrai navigateur (lecture et captures d'écran) ?")) return;
  await post("/api/browser?on=" + !S.browser_enabled); poll();
};
$("#directiveBtn").onclick = async () => {
  const d = prompt("Consigne permanente pour toute l'équipe (ex. « Priorité : sites pour artisans et jeux mobiles, pas de crypto »)", S.directive || "");
  if (d !== null) await post("/api/directive", {content: d});
};
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("#installBtn").hidden = false; });
$("#installBtn").onclick = async () => { if (installEvt) { installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("#installBtn").hidden = true; } };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
setView("chat");
api("/api/setup").then(st => { if (st.needs_key) { tab = "setup"; setView("more"); } renderTabs(); renderPane(); }).catch(() => {});
renderTabs(); poll(); setInterval(poll, 3000);
</script>
