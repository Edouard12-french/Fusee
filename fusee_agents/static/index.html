<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fusée</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#6d28d9">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#0b0b1a;--bg2:#12122a;--panel:rgba(22,22,48,.78);--panel2:rgba(34,34,70,.72);--line:rgba(140,140,255,.16);--text:#eef0ff;--muted:#a3a8c8;
  --accent:#8b5cf6;--accent2:#ec4899;--accent3:#f97316;--ok:#22c55e;--bad:#f43f5e;--warn:#f59e0b;--me:linear-gradient(135deg,#7c3aed,#db2777);
  --glow1:rgba(139,92,246,.30);--glow2:rgba(236,72,153,.22);--glow3:rgba(14,165,233,.20);--shadow:0 8px 30px rgba(0,0,0,.35)}
:root[data-theme="light"]{--bg:#f6f4ff;--bg2:#fff;--panel:rgba(255,255,255,.85);--panel2:rgba(246,243,255,.95);--line:rgba(110,80,200,.16);--text:#1d1b3a;--muted:#6b6890;
  --glow1:rgba(139,92,246,.18);--glow2:rgba(236,72,153,.14);--glow3:rgba(14,165,233,.14);--shadow:0 6px 24px rgba(80,60,160,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font:14px/1.45 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(900px 500px at 0% 0%,var(--glow1),transparent 60%),radial-gradient(800px 500px at 100% 10%,var(--glow2),transparent 60%),
  radial-gradient(900px 600px at 50% 110%,var(--glow3),transparent 60%),var(--bg)}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));flex-wrap:wrap;color:#fff;
  background:linear-gradient(100deg,#6d28d9 0%,#c026d3 45%,#f97316 100%);box-shadow:0 4px 24px rgba(192,38,211,.35);position:relative;z-index:2}
header h1{font-size:19px;margin:0 6px 0 0;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
header h1 img{width:28px;height:28px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header .pill{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);color:#fff}
header button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
header button:hover{background:rgba(255,255,255,.28);border-color:#fff}
header button.on{background:rgba(34,197,94,.35);border-color:#bbf7d0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px;white-space:nowrap}
.bar{width:90px;height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:#fff}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit;transition:transform .12s,border-color .12s}
button:hover{border-color:var(--accent);transform:translateY(-1px)}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.35)}
button.on{background:#14532d;border-color:var(--ok);color:#fff}
a{color:#a78bfa}:root[data-theme="light"] a{color:#6d28d9}
main{flex:1;display:grid;grid-template-columns:270px 1fr 480px;min-height:0;gap:0}
aside,section{min-height:0;overflow:auto}
#agents{padding:12px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(139,92,246,.06),transparent 40%)}
.agent{--ag:#8b5cf6;display:flex;gap:10px;padding:10px;border-radius:14px;cursor:pointer;margin-bottom:8px;background:var(--panel);
  border:1px solid var(--line);border-left:4px solid var(--ag);box-shadow:var(--shadow);transition:transform .12s}
.agent:hover{transform:translateX(2px)}
.agent.sel{background:linear-gradient(135deg,color-mix(in srgb,var(--ag) 24%,transparent),var(--panel));border-color:var(--ag)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:var(--ag,#8b5cf6);
  box-shadow:0 4px 14px color-mix(in srgb,var(--ag,#8b5cf6) 45%,transparent)}
.agent b{display:block;color:color-mix(in srgb,var(--ag) 55%,var(--text))}
.agent small{color:var(--muted);display:block;font-size:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#64748b}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}.dot.err{background:var(--bad)}
#chat{display:flex;flex-direction:column}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{--ag:#8b5cf6;max-width:80%;border-radius:16px;padding:9px 13px;white-space:pre-wrap;word-wrap:break-word;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ag) 20%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--ag) 35%,transparent);
  border-top-left-radius:4px;box-shadow:var(--shadow)}
.msg .who{font-weight:700;font-size:12px;margin-bottom:2px;color:color-mix(in srgb,var(--ag) 70%,var(--text))}
.msg .t{color:var(--muted);font-size:11px;text-align:right}
.msg.me{align-self:flex-end;background:var(--me);border:0;color:#fff;border-top-left-radius:16px;border-top-right-radius:4px}
.msg.me .who,.msg.me .t{color:rgba(255,255,255,.85)}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;white-space:normal}
.att img{max-width:220px;max-height:220px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.att video{max-width:260px;max-height:300px;border-radius:10px;background:#000}
.lnk{display:inline-block;background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(236,72,153,.18));border:1px solid rgba(167,139,250,.45);border-radius:10px;
  padding:3px 9px;font-size:12px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
form.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
textarea,input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit}
textarea:focus,input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);border-color:transparent}
textarea{flex:1;resize:none}
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(236,72,153,.05),transparent 30%)}
.tabs{display:flex;gap:5px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:5px 10px;font-size:13px;border-radius:999px}
.tabs button.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(236,72,153,.3)}
#pane{padding:12px;overflow:auto;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h4{margin:0 0 6px}.muted{color:var(--muted);font-size:12px}.muted2{opacity:.9;font-size:12px;margin-top:4px}
.card.pending{border-color:var(--warn);box-shadow:0 0 0 1px rgba(245,158,11,.25),var(--shadow)}.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent)}
.act{border-left:3px solid var(--line);padding:4px 8px;margin-bottom:6px;font-size:13px;border-radius:2px}
.act.web{border-color:#0ea5e9}.act.outil{border-color:var(--warn)}.act.fichier,.act.capture,.act.vidéo,.act.vente{border-color:var(--ok)}.act.erreur{border-color:var(--bad)}.act.réflexion{border-color:var(--accent)}
details summary{cursor:pointer}
pre{white-space:pre-wrap;word-wrap:break-word;background:rgba(0,0,0,.28);padding:8px;border-radius:10px;font-size:12px;max-height:400px;overflow:auto}
:root[data-theme="light"] pre{background:#f1eefc}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px;border-bottom:1px solid var(--line);text-align:left}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);display:inline-block;margin:1px 0;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.badge{background:linear-gradient(135deg,#f43f5e,#f97316);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.md h1,.md h2,.md h3{margin:.6em 0 .3em}
.score{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}.score i{display:block;height:100%}
.thread{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.bub{max-width:85%;padding:7px 10px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:13px}
.bub.in{align-self:flex-start;background:var(--panel2)}.bub.out{align-self:flex-end;background:linear-gradient(135deg,rgba(124,58,237,.55),rgba(219,39,119,.45));color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid img,.grid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.preview{width:100%;height:220px;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;background:#fff;margin:6px 0}
.preview iframe{width:250%;height:250%;transform:scale(.4);transform-origin:0 0;border:0;pointer-events:none}
.big{font-size:26px;font-weight:800}
.hero-card{border-radius:16px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#7c3aed,#db2777 60%,#f97316);box-shadow:0 8px 30px rgba(219,39,119,.3)}
.req-group{--ag:#8b5cf6;border-radius:16px;padding:12px;margin-bottom:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--ag) 16%,var(--panel)),var(--panel));
  border:1px solid color-mix(in srgb,var(--ag) 45%,transparent);box-shadow:var(--shadow)}
.req-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}.req-head .av{--ag:inherit}
.req{background:var(--panel2);border-radius:12px;padding:10px;margin-top:8px;border-left:4px solid var(--ag)}
.req-kind{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
#toasts{position:fixed;top:70px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-left:5px solid var(--accent2);border-radius:14px;padding:10px 14px;
  box-shadow:0 12px 40px rgba(0,0,0,.4);cursor:pointer;animation:tin .35s ease}
.toast b{display:block;margin-bottom:2px}.toast .muted{display:block;max-height:3.2em;overflow:hidden}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
button.meet{background:linear-gradient(135deg,#0ea5e9,#22c55e);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(14,165,233,.35);white-space:nowrap}
#meetBar{margin:0 12px 8px;padding:8px 12px;border-radius:12px;color:#fff;font-size:13px;background:linear-gradient(135deg,#0ea5e9,#22c55e);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#meetBar[hidden]{display:none}#meetBar .who{opacity:.45}#meetBar .who.done{opacity:1}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
#lightbox.open{display:grid}#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
nav#bottom{display:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:9px}
@media (max-width:1000px){
  main{display:block;position:relative}
  #agents,#chat,#side{position:absolute;inset:0;display:none}
  body.v-team #agents{display:block}body.v-chat #chat{display:flex}body.v-more #side{display:flex}
  #agents{border:0}#side{border:0}
  nav#bottom{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
  nav#bottom button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;font-size:12px;color:var(--muted)}
  nav#bottom button.sel{color:var(--text);background:linear-gradient(180deg,rgba(139,92,246,.25),transparent)}
  .msg{max-width:92%}.pill.hide-m{display:none}.lbl{display:none}.hide-mi{display:none}header h1 span{display:none}header .bar{display:none}header{flex-wrap:nowrap;gap:6px;padding:8px 10px}header h1{font-size:16px}header button{padding:6px 9px}
  .att img{max-width:150px}.att video{max-width:170px;max-height:240px}
}
</style>
</head>
<body class="v-chat">
<header>
  <h1><img src="/icon-192.png" alt=""><span>Fusée</span></h1>
  <span class="pill hide-m" id="model"></span>
  <span class="pill" title="Argent restant · dépense IA du jour">💶 <span id="cost"></span><span class="bar"><i id="costbar"></i></span></span>
  <span style="flex:1"></span>
  <button id="themeBtn" title="Thème clair / sombre">🌗</button>
  <button id="installBtn" hidden>📲<span class="lbl"> Installer l'app</span></button>
  <button id="browserBtn" title="Autoriser les agents à naviguer sur internet avec un vrai navigateur"></button>
  <button id="directiveBtn" title="Consigne permanente lue par tous les agents">🎯<span class="lbl"> Consigne</span></button>
  <button id="pauseBtn"></button>
</header>
<main>
  <aside id="agents"></aside>
  <section id="chat">
    <div id="msgs"></div>
    <div id="meetBar" hidden></div>
    <form class="send" id="f"><textarea id="txt" rows="2" placeholder="Écris au groupe… (@Neo pour un agent) — ou 🎙️ Réunion : les 14 te répondent en même temps"></textarea>
      <div style="display:flex;flex-direction:column;gap:6px"><button class="primary">Envoyer</button><button type="button" id="meetBtn" class="meet" title="Tous les agents répondent en même temps, en quelques secondes">🎙️ Réunion</button></div></form>
  </section>
  <aside id="side">
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </aside>
</main>
<nav id="bottom">
  <button data-v="team">🤖<br>Équipe</button>
  <button data-v="chat">💬<br>Groupe</button>
  <button data-v="more" id="moreBtn">📋<br>Suivi</button>
</nav>
<div id="lightbox"><img alt=""></div>
<div id="toasts"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const time = ts => new Date(ts * 1000).toLocaleString("fr-FR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
const mdTable = block => {
  const rows = block.trim().split("\n").filter(r => !/^\|[\s:|-]+\|$/.test(r.trim()));
  return "<table>" + rows.map((r, i) => "<tr>" + r.trim().replace(/^\||\|$/g, "").split("|")
    .map(c => i === 0 ? `<th>${c.trim()}</th>` : `<td>${c.trim()}</td>`).join("") + "</tr>").join("") + "</table>";
};
const md = s => esc(s).replace(/(?:^\|.*\|[ \t]*(?:\n|$))+/gm, mdTable)
  .replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  .replace(/^---$/gm,"<hr>").replace(/(<\/h[123]>|<\/table>|<hr>)\n+/g,"$1").replace(/\n/g,"<br>");
const api = (u, opt) => fetch(u, opt).then(r => r.json());
const post = (u, body) => fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
const wpath = p => "/w/" + p.split("/").map(encodeURIComponent).join("/");
let openProduct = null, S = {agents:[]}, lastId = 0, selected = null, tab = "agent", lastSig = "", openContact = null;
const TABS = {setup:"🚀 Démarrage", owner:"📥 Demandes", agent:"🤖 Agent", approvals:"✅ Validations", products:"📦 Produits", content:"📅 Contenus", outreach:"🎯 Prospection", contacts:"👥 Prospects", money:"💰 Argent",
  vitrine:"🖼️ Vitrine", flows:"⛓️ Workflows", box:"🧰 Boîte", ideas:"💡 Idées", reports:"📄 Rapports", pf:"📈 Bourse",
  notifs:"🔔 Notifs", settings:"⚙️ Réglages", feed:"⚡ Tout"};
const colorOf = n => (S.agents.find(a => a.name === n) || {}).color || "#22c55e";
const emojiOf = n => (S.agents.find(a => a.name === n) || {}).emoji || "👤";
const SENT = {"très positif":"😍", "positif":"🙂", "neutre":"😐", "hésitant":"🤔", "négatif":"😠", "inconnu":"❔"};

function attHtml(att) {
  if (!att) return "";
  const f = (att.files || []).map(p => /\.(mp4|webm)$/i.test(p)
    ? `<video src="${wpath(p)}#t=1" controls playsinline preload="metadata"></video>`
    : /\.(png|jpe?g|gif|webp)$/i.test(p) ? `<img src="${wpath(p)}" loading="lazy" alt="">`
    : `<a class="lnk" href="${wpath(p)}" target="_blank">📎 ${esc(p)}</a>`).join("");
  const l = (att.links || []).map(u => `<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">🔗 ${esc(u.replace(/^https?:\/\//, ""))}</a>`).join("");
  return f || l ? `<div class="att">${f}${l}</div>` : "";
}

function renderAgents() {
  $("#agents").innerHTML = S.agents.map(a => {
    const st = a.status || "en attente", cls = st === "travaille" ? "on" : st.startsWith("erreur") || st.startsWith("budget") ? "err" : "";
    return `<div class="agent ${selected===a.name?"sel":""}" data-n="${a.name}" style="--ag:${a.color}">
      <div class="av">${a.emoji}</div>
      <div style="min-width:0"><b>${a.name}${(S.unread_dms || {})[a.name] ? ` <span class="badge" title="Message privé">💬 ${S.unread_dms[a.name]}</span>` : ""}</b><small>${esc(a.kind)} · ${esc(a.title)}</small>
      <small><span class="tag">${a.model.replace("claude-","").replace(/-(\d)-(\d)$/," $1.$2")}</span> <span class="tag">${a.interval_min ? "toutes les " + a.interval_min + " min" : "à la demande"}</span></small>
      <small><span class="dot ${cls}"></span>${esc(st)}</small>
      <small title="${esc(a.task)}" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.task || "—")}</small>
      <small>${a.cycles||0} cycles · ${(a.cost_usd||0).toFixed(2)} $</small></div></div>`;
  }).join("");
  document.querySelectorAll(".agent").forEach(el => el.onclick = () => { selected = el.dataset.n; tab = "agent"; renderAgents(); renderTabs(); renderPane(); setView("more"); });
}

let lastNotif = null;
function ding() {  // petit son doux, sans fichier
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(880, c.currentTime); o.frequency.exponentialRampToValueAtTime(1320, c.currentTime + .12);
    g.gain.setValueAtTime(.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.12, c.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .45);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .5); } catch (e) {}
}
function toast(n) {
  const icon = {validation: "🛡️", rapport: "📄", client: "💬", alerte: "🔔"}[n.kind] || "🔔";
  const target = {validation: "owner", rapport: "reports", client: "contacts", alerte: "notifs"}[n.kind] || "notifs";
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<b>${icon} ${esc(n.title)}</b><span class="muted">${esc(n.body)}</span>`;
  el.onclick = () => { tab = n.title.includes("t'écrit en privé") ? "agent" : target;
    if (tab === "agent") selected = (S.agents.find(a => n.title.includes(a.name)) || {}).name || selected;
    renderTabs(); renderPane(); setView("more"); el.remove(); };
  $("#toasts").prepend(el); setTimeout(() => el.remove(), 9000);
  while ($("#toasts").children.length > 3) $("#toasts").lastChild.remove();
}
let meet = null;
function updateMeet() {
  if (!meet) return;
  const bar = $("#meetBar"), n = meet.agents.filter(a => meet.done.has(a)).length;
  if (n >= meet.agents.length || Date.now() - meet.start > 120000) { bar.hidden = true; meet = null; return; }
  bar.hidden = false;
  bar.innerHTML = `🎙️ Réunion : <b>${n}/${meet.agents.length}</b> ont répondu ` + meet.agents.map(a => `<span class="who ${meet.done.has(a) ? "done" : ""}" title="${a}">${emojiOf(a)}</span>`).join("");

function addMessages(list) {
  const box = $("#msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  for (const m of list) {
    lastId = Math.max(lastId, m.id);
    if (meet && m.id > meet.since && meet.agents.includes(m.sender)) meet.done.add(m.sender);
    const me = m.sender === "Patron";
    box.insertAdjacentHTML("beforeend", `<div class="msg ${me?"me":""}" style="--ag:${colorOf(m.sender)}"><div class="who">${emojiOf(m.sender)} ${esc(m.sender)}</div>${esc(m.content).replace(/(^|\s)@(\w+)/g,"$1<b>@$2</b>")}${attHtml(m.attachments)}<div class="t">${time(m.ts)}</div></div>`);
  }
  if (list.length && stick) box.scrollTop = box.scrollHeight;
  updateMeet();
}

async function poll() {
  try {
    const r = await api("/api/state?after=" + lastId);
    S = r;
    if (!selected) selected = r.agents[0]?.name;
    $("#model").textContent = "plan " + r.plan;
    $("#cost").innerHTML = `${r.budget.remaining_eur.toFixed(0)} €<span class="hide-mi"> · IA ${r.budget.api_today_eur.toFixed(2)}/${r.budget.api_daily_cap_eur.toFixed(2)} €</span>`;
    $("#costbar").style.width = Math.min(100, 100 * r.budget.api_today_eur / Math.max(r.budget.api_daily_cap_eur, 0.01)) + "%";
    $("#pauseBtn").innerHTML = r.paused ? "▶️<span class=lbl> Reprendre</span>" : "⏸️<span class=lbl> Pause</span>";
    $("#browserBtn").innerHTML = r.browser_enabled ? "🌐<span class=lbl> Navigateur : autorisé</span>" : "🌐<span class=lbl> Navigateur : bloqué</span>";
    $("#browserBtn").classList.toggle("on", r.browser_enabled);
    renderAgents(); addMessages(r.messages);
    const ln = r.latest_notification;
    if (lastNotif === null) lastNotif = ln ? ln.id : 0;  // au chargement : pas d'alerte pour les anciennes
    else if (ln && ln.id > lastNotif) { toast(ln); if (S._sound !== false) ding(); lastNotif = ln.id; }
    const sig = [r.pending_approvals, r.unread_notifications, r.waiting_contacts, r.open_questions, r.open_owner_tasks].join("/");
    if (sig !== lastSig) { lastSig = sig; renderTabs(); if (["approvals","contacts","owner"].includes(tab)) renderPane(true); }
    if (["agent", "feed", "flows"].includes(tab) || (tab === "contacts" && openContact)) renderPane(true);
    const n = r.pending_approvals + r.waiting_contacts + r.open_questions; $("#moreBtn").innerHTML = "📋<br>Suivi" + (n ? ` <span class="badge">${n}</span>` : "");
  } catch (e) { console.error(e); }
}

function setupValues(i) {
  const o = {}; document.querySelectorAll("#pane details")[i].querySelectorAll("[data-k]").forEach(el => { if (el.value.trim()) o[el.dataset.k] = el.value.trim(); });
  if (o.NTFY_TOPIC === undefined) { const el = document.querySelector('[data-k="NTFY_TOPIC"]'); if (el && !el.value && i === 1) { o.NTFY_TOPIC = el.placeholder.replace("ex. ", ""); el.value = o.NTFY_TOPIC; } }
  return o;
}
async function setupSave(i) {
  const r = await post("/api/setup/save", setupValues(i));
  const d = r.ok ? await r.json() : null;
  $("#sres" + i).textContent = !r.ok ? "Erreur : " + (await r.text())
    : d.applied ? "Clé enregistrée et appliquée ✅ — l'équipe se réveille !" : "Enregistré ✅ (redémarre Fusée pour appliquer)";
  if (r.ok) { const sm = document.querySelectorAll("#pane details")[i].querySelector("summary b"); sm.textContent = sm.textContent.replace("⚪", "✅"); }
}
async function setupTest(i) {
  $("#sres" + i).textContent = "Test en cours…";
  const r = await post("/api/setup/test", {service: SETUP_STEPS[i].test, values: setupValues(i)});
  const d = r.ok ? await r.json() : {ok: false, message: await r.text()};
  $("#sres" + i).textContent = d.message; $("#sres" + i).style.color = d.ok ? "var(--ok)" : "var(--bad)";
}
async function setupRestart() {
  const r = await post("/api/setup/restart"); if (!r.ok) { alert(await r.text()); return; }
  $("#srestart").textContent = "Redémarrage… la page se recharge toute seule.";
  setTimeout(function wait() { fetch("/manifest.webmanifest").then(x => x.ok ? location.reload() : setTimeout(wait, 1500)).catch(() => setTimeout(wait, 1500)); }, 3000);
}
function copyText(id, btn) {
  const el = document.getElementById(id); el.select();
  const done = () => { btn.textContent = "✅ Copié"; setTimeout(() => btn.textContent = "📋 Copier le texte", 1500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(el.value).then(done);
  else { document.execCommand("copy"); done(); }
}
async function campaignStatus(id, status) { const r = await post(`/api/campaigns/${id}?status=${encodeURIComponent(status)}`); if (!r.ok) alert(await r.text()); renderPane(); }
async function prospectSent(id) { await post(`/api/prospects/${id}/sent`); renderPane(); }
async function prospectStop(id) { if (confirm("Ne plus jamais contacter cette adresse ?")) { await post(`/api/prospects/${id}/stop`); renderPane(); } }
async function contentStatus(id, status) { await post(`/api/content/${id}?status=${encodeURIComponent(status)}`); renderPane(); }
const PROFILE_FIELDS = [["prenom", "Ton prénom", "text", ""], ["appel", "Comment veux-tu qu'ils t'appellent ?", "text", "ex. Ed, Patron, Boss…"],
  ["age", "Ton âge", "select", ["", "Moins de 15 ans", "15-17 ans", "18-25 ans", "Plus de 25 ans"]], ["ville", "Ta ville ou ta région (pour les commerces près de chez toi)", "text", "ex. Lyon"],
  ["aime", "Ce que tu aimes, tes passions", "text", "ex. jeux vidéo, foot, dessin, tech…"], ["competences", "Ce que tu sais faire", "text", "ex. montage vidéo, parler aux gens…"],
  ["objectif", "Ton objectif", "text", "ex. gagner 200 € avant l'été, apprendre le business…"],
  ["temps", "Temps que tu peux y passer", "select", ["", "Moins de 2 h par semaine", "2 à 5 h par semaine", "Plus de 5 h par semaine"]],
  ["autre", "Autre chose à savoir", "text", ""]];
async function profileCard() {
  const p = (await api("/api/owner_profile")).profile || {};
  return `<div class="card" style="border-left:4px solid var(--accent2)"><h4>🙋 Me présenter à l'équipe</h4>
    <p class="muted">Les 14 agents liront cette fiche en permanence : ils t'appelleront par ton prénom et adapteront leurs idées à ta ville, tes goûts et ton temps. Ne mets pas ton adresse, ton école ou d'infos très personnelles.</p>
    <div style="display:grid;gap:6px">${PROFILE_FIELDS.map(([k, label, type, extra]) => `<label class="muted">${label}</label>` + (type === "select"
      ? `<select data-p="${k}">${extra.map(o => `<option ${p[k] === o ? "selected" : ""} value="${esc(o)}">${o || "—"}</option>`).join("")}</select>`
      : `<input data-p="${k}" value="${esc(p[k] || "")}" placeholder="${esc(extra)}">`)).join("")}</div>
    <button class="primary" style="margin-top:8px" onclick="saveOwnerProfile(this)">💾 Enregistrer</button></div>`;
}
async function saveOwnerProfile(btn) {
  const o = {}; document.querySelectorAll("[data-p]").forEach(el => o[el.dataset.p] = el.value.trim());
  if (!o.prenom) { alert("Mets au moins ton prénom 🙂"); return; }
  await post("/api/owner_profile", o); btn.textContent = "✅ Enregistré : l'équipe te connaît !"; poll();
}
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
async function renderDeviceBox() {
  const box = $("#devBox"); if (!box) return;
  const {url} = await api("/api/device_url");
  if (!url) {
    box.innerHTML = `1. Installe l'app gratuite <b>Tailscale</b> sur ce Mac, ton iPhone et ton iPad, et connecte-toi <b>avec le même compte</b> sur les trois.<br>
      2. Sur le Mac, dans le dossier Fusee, double-clique sur <b>« Activer iPhone et iPad »</b>.<br>3. Reviens ici : un QR code apparaîtra.`;
    return;
  }
  box.innerHTML = `<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <img src="/api/qr?${Date.now()}" alt="QR code" style="width:170px;height:170px;background:#fff;border-radius:12px;padding:6px">
      <div style="flex:1;min-width:200px;color:var(--text)">
        <b>Sur ton iPhone ou ton iPad</b> (Tailscale allumé) :<br>1. ouvre l'<b>Appareil photo</b> et vise ce QR code → touche le lien ;<br>
        2. dans Safari : <b>Partager</b> → <b>Sur l'écran d'accueil</b> → Ajouter ;<br>3. ouvre <b>Fusée</b> depuis l'icône → ⚙️ Réglages → active les notifications.
        <div class="muted" style="margin-top:6px">Adresse privée : <code>${esc(url)}</code> — seuls tes appareils Tailscale peuvent l'ouvrir.</div></div></div>`;
}
async function renderPushBox() {
  const box = $("#pushBox"); if (!box) return;
  const info = await api("/api/push");
  const devices = info.devices.length ? `<div style="margin-top:6px">✅ Abonnés : ${info.devices.map(d => `${esc(d.device)} <span class="muted">(${time(d.ts)})</span>`).join(", ")}
    — <a href="#" onclick="post('/api/push/forget').then(renderPushBox);return false">tout désactiver</a></div>` : "";
  let html;
  if (!window.isSecureContext) {
    html = `Pour les notifications sur ton iPhone, ouvre Fusée avec ton <b>adresse privée https</b> (étape « 📱 Fusée sur ton iPhone » dans 🚀 Démarrage), pas avec une adresse en http.`;
  } else if (isIOS && !standalone) {
    html = `Sur iPhone, Apple n'autorise les notifications que pour les apps de l'écran d'accueil :<br>1. touche <b>Partager</b> (carré avec une flèche) → <b>Sur l'écran d'accueil</b> → Ajouter ;<br>2. ouvre <b>Fusée</b> depuis sa nouvelle icône ;<br>3. reviens ici et touche « Activer ». (iOS 16.4 ou plus récent.)`;
  } else if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    html = `Cet appareil ou ce navigateur ne gère pas les notifications web. Sur iPhone : iOS 16.4+ et Fusée ajoutée à l'écran d'accueil.`;
  } else {
    html = `<button class="primary" onclick="enablePush(this)">🔔 Activer les notifications ${isIOS ? "sur cet iPhone" : "sur cet appareil"}</button>
      <div class="muted" style="margin-top:4px">Chiffrées de bout en bout : seul ton appareil peut les lire.</div>`;
  }
  box.innerHTML = html + devices;
}
async function enablePush(btn) {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { btn.textContent = "Autorisation refusée : Réglages de l'iPhone → Notifications → Fusée"; return; }
    const reg = await navigator.serviceWorker.ready, info = await api("/api/push");
    const key = Uint8Array.from(atob(info.key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((info.key.length + 3) % 4)), c => c.charCodeAt(0));
    const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: key});
    const r = await post("/api/push/subscribe", {subscription: sub.toJSON(), device: isIOS ? "iPhone" : (navigator.userAgentData?.platform || "appareil")});
    btn.textContent = r.ok ? "✅ Activé : une notification de test arrive" : "Erreur : " + await r.text();
    setTimeout(renderPushBox, 2500);
  } catch (e) { btn.textContent = "Impossible : " + e.message; }
}
async function testNotif(btn) {
  const d = await (await post("/api/test_notification")).json();
  btn.textContent = d.mac ? "✅ Envoyée : regarde en haut à droite de ton écran" : "✅ Envoyée : elle apparaît ici" + (d.phone ? " et sur ton téléphone" : "");
}
async function runDiag(btn) {
  btn.disabled = true; btn.textContent = "⏳ Test des agents en cours…"; const box = $("#diagRes");
  const r = await post("/api/diagnostic");
  btn.disabled = false; btn.textContent = "🩺 Refaire le diagnostic";
  if (!r.ok) { box.innerHTML = `<p class="neg">${esc((await r.json().catch(() => ({}))).detail || "Erreur")}</p>`; return; }
  const d = await r.json();
  box.innerHTML = `<p><b>${d.ok ? "✅ Tout marche : l'équipe est prête !" : "⚠️ Certains agents ont un problème :"}</b></p><table>` +
    d.results.map(x => `<tr><td>${emojiOf(x.agent)} ${x.agent}</td><td>${x.ok ? "✅" : "❌"}</td><td class="muted">${esc(x.model.replace("claude-", ""))}${x.ok ? ` · ${x.secondes} s` : ""}</td></tr>` +
      (x.ok ? "" : `<tr><td colspan="3" class="neg" style="font-size:12px">${esc(x.message)}</td></tr>`)).join("") + "</table>";
}

function setView(v) {
  document.body.className = "v-" + v;

const applyTheme = t => { document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#7c3aed" : "#6d28d9"; };
try { applyTheme(localStorage.getItem("fusee-theme") || "dark"); } catch (e) { applyTheme("dark"); }

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
setView("chat");
const hashTab = () => { const h = location.hash.slice(1); if (h && TABS[h]) { tab = h; setView("more"); renderTabs(); renderPane(); return true; } return false; };

poll().then(() => api("/api/setup")).then(st => {  // d'abord les données, ensuite l'onglet demandé
  if (!hashTab() && st && st.needs_key) { tab = "setup"; setView("more"); }
  renderTabs(); renderPane();
}).catch(() => renderPane());
setInterval(poll, 3000);
